name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.5.0
          cache: npm
      - name: Verify tag and version
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          test "${GITHUB_REF_NAME}" = "v${VERSION}"
          npm run check
      - name: Build immutable archive
        shell: bash
        run: |
          npm pack --ignore-scripts
          node scripts/checksum.mjs "nova-forge-$(node -p "require('./package.json').version").tgz" > SHA256SUMS
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release create "${GITHUB_REF_NAME}" nova-forge-*.tgz SHA256SUMS --verify-tag --generate-notes
